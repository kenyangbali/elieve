[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "elieve"
version = "0.1.0"
description = "Modular AI agent framework — ReAct loop with sandboxed tools, context compaction, cross-session memory, permission gates, and multi-agent orchestration."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "elieve-dev" }]
keywords = ["ai", "agent", "react", "llm", "openai-compatible"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
elieve = "elieve.loop:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["elieve*"]
