# Profil bug-hunter — dipakai via: python3 -m elieve.loop --config configs/bug-hunter.yaml --task "..." --outdir ...
# Nilai di sini menjadi default; flag CLI (--model, --max-steps) menimpa bila diisi.

model: cx/gpt-5.6-terra   # best available (ag/* rate-limited 2026-10-09)
# Alternatif saat ag/* pulih: ag/claude-opus-4-6-thinking, ag/gemini-3.1-pro, ag/gemini-3-flash
# DILARANG: bns/* dan oc/* (kuota terlarang — ditolak di kode)

max_steps: 40

# Provider: OpenAI-compatible endpoint + key source (elieve/providers.py).
# What used to be personal hardcode (127.0.0.1:20128, the 9router sqlite key,
# ag/*-only models) is now plain configuration — swap this block to use any
# other provider (see configs/example.yaml).
provider:
  base_url: http://127.0.0.1:20128/v1
  key_provider: "9router"   # read ~/.9router/db/data.sqlite (table apiKeys, name='Default Key')
  api_key_env: ""           # used only when key_provider is empty: NAME of env var holding the key
  model: cx/gpt-5.6-terra   # canonical; top-level `model:` above still overrides
  timeout_s: 180

# Model policy: allow/forbid lists, trailing `*` = prefix wildcard.
# Empty/missing = unrestricted. forbid wins over allow.
# Replaces the old hardcoded ag/*-vs-bns/*/oc/* checks in code.
model_policy:
  # ATURAN BAYU 2026-10-09 18:56 (revisi 19:16 — jangan mengekang):
  # Baseline agent & orchestrator: cx/gpt-5.6-terra / ag/claude-opus-4-6-thinking.
  # - BOLEH dan WAJIB pakai model yang LEBIH BAIK jika muncul (generasi lebih baru,
  #   benchmark lebih tinggi, atau tier akun naik). Jangan terkunci di model lama.
  # - Kedua baseline mati & tak ada pengganti lebih baik -> STOP pakai elieve agent.
  # - Satu mati -> yang hidup (atau yang lebih baik) tambal kedua peran.
  # Classifier terpisah: gemini-3.1-flash-lite via API langsung (tidak kena policy ini).
  allow: ["cx/*", "ag/*"]
  forbid: ["bns/*", "oc/*"]

# Tool sandbox: the agent's working root (absolute). /tmp is always allowed too.
workspace_root: /home/hatch/workspace

# Default system-prompt language: en | id ('system_prompt' below still overrides).
language: id

# Prompt persona profile: default (generic agent) | hunter (bug-hunter).
# The hunter profile restores the strict evidence-first persona.
profile: hunter

# Tool yang boleh dipakai profil ini (subset dari elieve/tools).
tools:
  - read_file
  - list_dir
  - grep
  - exec

# Batas sandbox exec (dipaksa di kode, tulis di sini sbg dokumentasi).
sandbox:
  allowed_roots:
    - /home/hatch/workspace
    - /tmp
  exec_cwd: /home/hatch/workspace

# System prompt profil ini. Kosongkan (= null) untuk memakai default bawaan loop.py.
system_prompt: null

# Rate limit sopan antar panggilan model (detik).
model_call_delay_s: 3

# Fase 1 — context compaction (docs/PHASE1-COMPACTION.md).
compaction:
  enabled: true
  context_limit: 64000        # batas sebelum pipeline threshold agresif
  recency_window: 5           # turn terakhir yang tidak disentuh compaction
  micro_max_tool_chars: 2000  # hasil tool lebih panjang dari ini dipotong
  thresholds: [70, 80, 85, 90, 95]  # persen dari context_limit
  summarizer_model: ag/gemini-3-flash  # murah; bns/*/oc/* DITOLAK di kode
  full_compact_keep_recent: 5 # turn terakhir verbatim setelah full compact
  prefix_len: 2               # system + task awal: TIDAK PERNAH diubah

# Fase 2 — MEMORY.md + autoDream (docs/ARCHITECTURE.md §2).
memory:
  enabled: true
  tidy_every_runs: 5          # autoDream tiap N run (counter di <outdir>/.memory_counter)
  max_fact_chars: 150         # butir lebih panjang dipotong cerdas di batas kata
  summarizer_model: ag/gemini-3-flash  # murah; bns/*/oc/* DITOLAK di kode

# Fase 3 — permission gate 2 tahap (docs/ARCHITECTURE.md §3).
# Classifier OPSIONAL & PLUGGABLE ("by choose", keputusan Bayu 2026-10-09):
#   - classifier_model KOSONG  -> classifier OFF total (hanya regex lapisan-0)
#   - classifier_model DIISI   -> classifier ON (tahap 1 kilat via model itu)
#   - model MATI (timeout/error) -> fallback lapisan-0 per-call; auto-disable
#     setelah max_consecutive_failures gagal beruntun (run tidak crash).
# API key custom HANYA via env var (classifier_api_key_env = NAMA env var).
permissions:
  enabled: true
  classifier_model: "gemini-3.1-flash-lite"  # ON 2026-10-09: model kecil/hemat via Gemini API langsung (11 key Bayu)
  classifier_api_base: "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions"  # OpenAI-compatible; bypass 9router ag/* yg rate-limit
  classifier_api_key_env: "ELIEVE_CLASSIFIER_KEY"  # diisi dari ~/.elieve/gemini_classifier_keys (mode 600) via ~/.bashrc; key #1 aktif, 10 cadangan
  kilat_max_tokens: 32        # verdict kilat <64 token
  kilat_timeout_s: 10         # timeout singkat tahap 1
  max_consecutive_failures: 3 # auto-disable classifier setelah N gagal beruntun

# Gap 1 — hook lifecycle system (docs/HOOKS.md, elieve/hooks.py).
# Event deterministik yang tidak bisa di-skip model. Tiap aksi EITHER
# {action: nama_terdaftar} OR {shell: cmd, timeout: detik, blocking: bool}.
hooks:
  PreToolUse:
    - {action: "block_destructive_exec"}  # tolak exec destruktif (deterministik, tanpa LLM)
  PostToolUse:
    - {action: "qc_tool_output"}          # flag output >12000 char / Traceback
  PreCompact:
    - {action: "checkpoint_state"}        # tulis <outdir>/.precompact.json
  OnStop:
    - {action: "persist_state"}           # persist state di semua jalur keluar

# Gap 2 — structured task tracking (elieve/tasks.py, docs/TASKS.md).
# Checklist per-run: tool task_update (add/set/list), persist otomatis ke
# <outdir>/tasks.json, ringkasan "## Daftar task" disuntik ke system
# prompt tiap turn (<300 char, survive compaction).
tasks:
  enabled: true
  max_tasks: 64            # add() di atas batas ditolak
  summary_max_chars: 300   # batas ringkasan di system prompt

# Gap 3 — akuntansi token & estimasi biaya (elieve/accounting.py).
# Harga = USD per 1K token. Nilai di bawah = PLACEHOLDER —
# sesuaikan dengan harga aktual provider sebelum dipakai untuk budgeting.
accounting:
  enabled: true
  prices:
    ag/claude-opus-4-6-thinking: {input_per_1k: 0.015, output_per_1k: 0.075}
    ag/gemini-3.1-pro: {input_per_1k: 0.0025, output_per_1k: 0.01}
    ag/gemini-3-flash: {input_per_1k: 0.0005, output_per_1k: 0.002}
  run_cost_cap: 0.0        # USD; 0 = nonaktif. Bila tercapai -> stop rapi (status cost_capped, return 0)
  context_warn_pct: 80     # warning saat prompt_tokens >= N% dari compaction.context_limit

# Gap 4 — checkpoints / resume percakapan (elieve/checkpoints.py).
# Snapshot messages + ringkasan state (usage, tasks) ke
# <outdir>/checkpoints/ckpt-<step>.json (tulis atomik). Lanjutkan run
# dengan: python3 -m elieve.loop --resume <outdir> [--task ...]
checkpoints:
  enabled: true
  every_n_steps: 10   # snapshot periodik tiap N step; plus snapshot paksa
                      # sebelum compaction memampatkan konteks (PreCompact)

# Gap 5 — MCP client (elieve/mcp.py, docs/MCP.md).
# Opsional: tanpa blok ini (dan tanpa .mcp.json di cwd) loop jalan persis
# seperti biasa. Tiap tool server terekspos sebagai mcp__<server>__<tool>.
# Server stdio: {name, command, args}; server HTTP: {name, url}
# (transport default streamable-http; "sse" untuk legacy SSE).
# File .mcp.json di cwd (format {"mcpServers": {...}} ala Claude Code)
# juga dibaca; YAML menang bila nama tabrakan.
mcp:
  enabled: true
  timeout_s: 30          # timeout per operasi MCP (initialize/list/call)
  servers: []            # contoh:
    # - name: playwright
    #   command: npx
    #   args: ["-y", "@modelcontextprotocol/server-playwright"]
    # - name: api-internal
    #   url: http://127.0.0.1:8000/mcp
    #   transport: streamable-http   # atau "sse"

# Fase 4 — multi-agent orchestration (docs/ARCHITECTURE.md §4).
# OPSIONAL & PLUGGABLE ("by choose", keputusan Bayu 2026-10-09):
#   - orchestrator_model KOSONG atau enabled=false -> 100% single-agent (default lama)
#   - orchestrator_model DIISI -> task dipecah mandor, worker paralel di-spawn
#   - mandor MATI (timeout/error) -> fallback single-agent + warning (run tidak crash)
# API key custom HANYA via env var (orchestrator_api_key_env = NAMA env var).
orchestrator:
  enabled: true
  orchestrator_model: "cx/gpt-5.6-terra"  # ON 2026-10-09: model terbaik jadi mandor
  orchestrator_api_base: ""    # kosong = 9router lokal; isi URL OpenAI-compatible custom
  orchestrator_api_key_env: "" # NAMA env var berisi key custom (tak pernah di-hardcode)
  worker_model: ""             # kosong = pakai model utama
  max_workers: 4               # batas worker paralel (depth maks 1, anti fork-bomb)
  worker_max_steps: 20         # budget step tiap worker
  worker_readonly_default: false  # default toolset worker (bisa di-override mandor per subtask)
  plan_timeout_s: 120          # timeout planning mandor
  worker_timeout_s: 1800       # timeout tiap worker subprocess
  plan_first: false            # Gap 6: recon gate — true = fase plan read-only
                               # (tulis PLAN.md) SEBELUM worker mahal di-spawn
  plan_model: ""               # model fase recon; kosong = worker_model

# Gap 6 — Plan mode (CLI --plan): riset read-only (exec dipaksa mati),
# tulis <outdir>/PLAN.md dari jawaban akhir, lalu berhenti (exit 0).
# plan_model kosong = pakai model utama. Tanpa blok ini: default aman.
plan:
  plan_model: ""             # mis. ag/gemini-3-flash ; kosong = model utama
  max_steps: 30              # budget step fase riset
