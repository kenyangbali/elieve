# Example elieve config — generic OpenAI-compatible provider.
# Run: python3 -m elieve.loop --config configs/example.yaml --task "..." --outdir ./runs/demo
#
# This file documents every core block the loop understands. Only `provider`
# (endpoint + key source) is truly required; everything else has safe defaults.

# --- Provider ---------------------------------------------------------
# Any OpenAI-compatible chat-completions endpoint. The key itself is NEVER
# written here — give the NAME of an environment variable that holds it.
provider:
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY   # e.g. export OPENAI_API_KEY=sk-...
  # key_provider: "9router"     # alternative: read the key from a local
                                # 9router sqlite DB (~/.9router/db/data.sqlite,
                                # table apiKeys, row name='Default Key')
  model: gpt-4o-mini            # canonical model; top-level `model:` below overrides
  timeout_s: 180

# --- Model policy ------------------------------------------------------
# allow/forbid lists with trailing-`*` prefix wildcards. `forbid` wins over
# `allow`. Empty/missing lists = unrestricted.
model_policy:
  allow: []
  forbid: []

# Optional: overrides provider.model (canonical model lives in provider:).
# model: gpt-4o-mini

max_steps: 40

# Sandbox root for tools (the absolute path is stored; a relative path is
# resolved from the process cwd). /tmp is always allowed as a second root.
workspace_root: ./workspace

# Plan-mode instruction language: en | id (used only by --plan).
language: en

# Your system prompt (null = none at all — elieve ships no built-in prompt).
system_prompt: null

# --- Local Ollama example -----------------------------------------------
# provider:
#   base_url: http://localhost:11434/v1
#   api_key_env: OLLAMA_API_KEY   # Ollama needs no real key — export any
#                                 # dummy value, e.g. export OLLAMA_API_KEY=x
#   model: llama3.1
#   timeout_s: 300

# --- Optional blocks ------------------------------------------------------
# compaction / memory / permissions / hooks / tasks / accounting /
# checkpoints / orchestrator — see configs/bug-hunter.yaml for a fully
# worked example.

# Gap 5 — MCP client (elieve/mcp.py).
# Optional: without this block (and without .mcp.json in cwd) the loop
# behaves exactly as before. Each server tool is exposed as
# mcp__<server>__<tool>. stdio server: {name, command, args};
# HTTP server: {name, url} (default transport streamable-http;
# "sse" for legacy SSE). A .mcp.json file in the cwd
# ({"mcpServers": {...}}, Claude Code style) is also read; YAML wins
# on name collisions.
mcp:
  enabled: true
  timeout_s: 30
  servers: []

# Gap 4 — checkpoints / resume percakapan (elieve/checkpoints.py).
# Snapshot messages + ringkasan state ke <outdir>/checkpoints/ckpt-<step>.json.
# Default bila blok ini absen: enabled=true, every_n_steps=10.
checkpoints:
  enabled: true
  every_n_steps: 10

# Gap 6 — Plan mode (CLI --plan): riset read-only (exec dipaksa mati),
# tulis <outdir>/PLAN.md dari jawaban akhir, lalu berhenti (exit 0).
# plan_model kosong = pakai model utama. Tanpa blok ini: default aman.
plan:
  plan_model: ""             # mis. ag/gemini-3-flash ; kosong = model utama
  max_steps: 30              # budget step fase riset
